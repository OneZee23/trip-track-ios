name: TripTrack
options:
  bundleIdPrefix: com.onezee
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

# Visible in the navigator, but NOT a source or resource of any target. The
# StoreKit configuration lives here rather than inside `TripTrack/` on purpose:
# that target takes `path: TripTrack` wholesale and excludes only `*.xcassets`
# and `Info.plist`, so a `.storekit` dropped in there would be bundled as a
# resource and ship inside the Release app.
fileGroups:
  - Config

# The languages the app ships in. This is what the App Store lists under
# «Languages» and what iOS matches a phone's system language against when it
# picks an `InfoPlist.strings` for the permission prompts. The IN-APP language
# is a separate, user-chosen setting (`LanguageManager`), so a German phone can
# still be set to Russian inside the app — but its permission dialogs come from
# here, and they only exist for a region listed below.
knownRegions:
  - Base
  - en
  - ru
  - de
  - es
  - fr
  - it
  - pl
  - id
  - tr
  - fil
  - uk
  - kk
  - pt

# External SPM dependencies. Sentry is the first (and so far only) third-
# party package — added for crash + error reporting. The SDK no-ops when
# the DSN env-var is empty, so dev / simulator builds are zero-impact.
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    majorVersion: 8.36.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  TripTrack:
    type: application
    platform: iOS
    sources:
      - path: TripTrack
        excludes:
          - "**/*.xcassets/*"
          - Info.plist
      - path: TripTrack/Resources/Assets.xcassets
        type: asset
      - path: TripTrackShared
    dependencies:
      - target: TripTrackLiveActivityExtension
      - package: Sentry
        product: Sentry
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TripTrack/Info.plist
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "TripTrack uses background location to automatically detect when you start driving and record your trips — even when the app is closed."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "TripTrack uses your location to record your driving route on the map, calculate distance and speed, and save the trip to your travel journal."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "TripTrack uses Bluetooth to automatically detect when you start and end a drive"
        INFOPLIST_KEY_NSMotionUsageDescription: "TripTrack uses motion data to detect when you're driving and automatically start recording trips."
        # Needed by the in-app photo grid (Figma 117:587), which reads the
        # library directly so it can draw the canon's numbered selection.
        # The system picker needs no permission at all — that is the price of
        # the custom grid, and it is why the app asks for read access only.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "TripTrack shows your photo library so you can attach photos to a trip. Photos stay on your device unless you publish the trip yourself."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        MARKETING_VERSION: "0.6.3"
        CURRENT_PROJECT_VERSION: "54"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.onezee.TripTrack.dev
          INFOPLIST_KEY_CFBundleDisplayName: "TripTrack Dev"
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          # Dev builds talk to the local backend via a Bonjour `.local`
          # hostname (survives Mac IP changes). Resolving `.local` is
          # local-network access, which iOS 14+ gates behind this permission.
          # Debug-only — the prod build connects to api.trip-track.app over the
          # internet and never touches the local network.
          INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to your local TripTrack development server."
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.onezee.TripTrack
          INFOPLIST_KEY_CFBundleDisplayName: "TripTrack"
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: TripTrack/TripTrack.entitlements
      # Source of truth for capabilities — xcodegen rewrites the
      # entitlements file from these properties on every generate. Without
      # this block, toggling a capability off in Xcode's Signing pane
      # leaves the file as empty <dict/> and the next generate keeps it
      # empty, breaking Sign in with Apple and Push.
      # NOTE: `aps-environment: development` is correct for dev builds.
      # Archives for App Store automatically rewrite to `production` when
      # signed against a prod provisioning profile.
      properties:
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
        # UNIVERSAL LINKS — deliberately still off. Turning the two lines
        # below on makes `https://trip-track.app/u/<id>` open the app
        # directly instead of Safari; everything else for it already ships:
        # the app parses the URL (`TripTrackApp.handleWebLink`), the website
        # serves `/.well-known/apple-app-site-association` naming both bundle
        # ids, and the landing page's «Открыть в приложении» button covers the
        # link with the entitlement off.
        #
        # It needs one thing this repo cannot do: the Associated Domains
        # capability on the App IDs themselves (both `com.onezee.TripTrack`
        # and `.dev`). Without it the build fails at signing — «Provisioning
        # profile doesn't include the Associated Domains capability». Enable
        # it by building once from Xcode with the capability added (Xcode
        # updates the App ID and the profile), or with
        # `xcodebuild -allowProvisioningUpdates`, then uncomment:
        #
        # com.apple.developer.associated-domains:
        #   - applinks:trip-track.app
        #   - applinks:www.trip-track.app

  TripTrackLiveActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TripTrackLiveActivity
        excludes:
          - Info.plist
          - "**/*.xcassets/*"
      - path: TripTrackLiveActivity/Assets.xcassets
        type: asset
      - path: TripTrackShared
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_CFBundleDisplayName: "TripTrack Live"
        MARKETING_VERSION: "0.6.3"
        CURRENT_PROJECT_VERSION: "54"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        APP_INTENTS_DEPLOYMENT_POSTPROCESSING: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.onezee.TripTrack.dev.LiveActivity
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.onezee.TripTrack.LiveActivity
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    entitlements:
      path: TripTrackLiveActivity/TripTrackLiveActivity.entitlements

  # Apple Watch companion. Thin remote-control over the phone's
  # `TripManager` — does NOT run its own location tracker (battery
  # cost, complexity, dual-source data hazards). All state flows over
  # WCSession: phone publishes ApplicationContext snapshots, watch
  # sends start/stop/pause messages back. Bundle id suffix
  # `.watchkitapp` is Apple's convention for companion apps; pairing
  # via `WKApplication: YES` + `WKCompanionAppBundleIdentifier`
  # (auto-generated by xcodegen given the parent ID).
  TripTrackWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TripTrackWatch
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "TripTrack"
        INFOPLIST_KEY_WKApplication: YES
        MARKETING_VERSION: "0.6.3"
        CURRENT_PROJECT_VERSION: "54"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.onezee.TripTrack.dev.watchkitapp
          INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.onezee.TripTrack.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.onezee.TripTrack.watchkitapp
          INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.onezee.TripTrack
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig

  TripTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TripTrackTests
      # The tests run without a host app, so Bundle.main is the xctest
      # runner — the region atlas has to be copied in here as well or every
      # geometry test silently skips itself.
      - path: TripTrack/Resources/MapRegions.json
        buildPhase: resources
      # То же и с каталогом марок: `VehicleCatalogTests` читает его из бандла,
      # а без этой строки тест молча проходит на пустом каталоге.
      - path: TripTrack/Resources/VehicleCatalog.json
        buildPhase: resources
    dependencies:
      - target: TripTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onezee.TripTrackTests
        GENERATE_INFOPLIST_FILE: YES

  TripTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TripTrackUITests
    dependencies:
      - target: TripTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onezee.TripTrackUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TripTrack

schemes:
  TripTrack:
    build:
      targets:
        TripTrack: all
        TripTrackLiveActivityExtension: all
        # Watch target deliberately omitted from the 0.5.5 scheme —
        # App Store submission requires a complete watchOS app icon
        # set (1024 marketing + 5+ per-resolution variants), and we
        # don't have icon assets yet. The target definition + source
        # stays in the repo so re-enabling for 0.5.6 is a one-line
        # change once the icon is designed AND the WCSession glue is
        # tested on real Apple Watch hardware.
        # TripTrackWatch: all
    run:
      config: Debug
      # Local StoreKit testing: purchases resolve against this file instead of
      # Apple's servers, so the tip-jar probe needs no App Store Connect record
      # and no Paid Applications agreement. Applies to Run only — `archive`
      # below is Release and is untouched by it.
      storeKitConfiguration: Config/TripTrack.storekit
    test:
      config: Debug
      targets:
        - TripTrackTests
        - TripTrackUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
