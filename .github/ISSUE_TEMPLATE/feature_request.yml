name: Feature idea
description: Suggest something TripTrack could do
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation on the road or after a trip, not only the button you imagine.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
